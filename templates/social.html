<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
  :root {
    --bg-0: #0b0d10;
    --bg-1: #12151a;
    --line: rgba(255, 255, 255, 0.08);
    --text-0: #f2f4f7;
    --text-1: #9aa4b2;
    --accent: #5eead4;
    --accent-dim: rgba(94, 234, 212, 0.16);
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  html, body {
    width: 1280px;
    height: 640px;
    overflow: hidden;
    background: var(--bg-0);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto,
      Helvetica, Arial, sans-serif;
  }

  .stage {
    position: relative;
    width: 1280px;
    height: 640px;
    background:
      radial-gradient(760px 560px at 96% 50%, var(--accent-dim), transparent 62%),
      linear-gradient(180deg, var(--bg-1) 0%, var(--bg-0) 100%);
  }

  .grid {
    position: absolute;
    inset: 0;
    background-image:
      linear-gradient(var(--line) 1px, transparent 1px),
      linear-gradient(90deg, var(--line) 1px, transparent 1px);
    background-size: 80px 80px;
    -webkit-mask-image: radial-gradient(900px 640px at 30% 45%, black, transparent 75%);
    mask-image: radial-gradient(900px 640px at 30% 45%, black, transparent 75%);
    opacity: 0.5;
  }

  .content {
    position: relative;
    height: 100%;
    display: flex;
    flex-direction: column;
    justify-content: center;
    gap: 34px;
    padding: 0 0 0 120px;
    max-width: 880px;
  }

  .mark {
    display: flex;
    align-items: center;
    gap: 22px;
  }

  .dot {
    width: 22px;
    height: 22px;
    border-radius: 50%;
    background: var(--accent);
    box-shadow: 0 0 0 10px var(--accent-dim), 0 0 40px 8px rgba(94, 234, 212, 0.5);
    flex: none;
  }

  .name {
    font-size: 118px;
    font-weight: 700;
    letter-spacing: -0.02em;
    color: var(--text-0);
    line-height: 1;
    white-space: nowrap;
  }

  .tagline {
    font-size: 40px;
    font-weight: 400;
    color: var(--text-1);
    line-height: 1.35;
    max-width: 760px;
  }

  .chip {
    display: inline-flex;
    align-items: center;
    gap: 14px;
    width: fit-content;
    padding: 18px 28px;
    border-radius: 999px;
    background: rgba(255, 255, 255, 0.04);
    border: 1px solid var(--line);
    box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.06);
  }

  .chip .prompt {
    color: var(--accent);
    font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    font-size: 26px;
  }

  .chip .cmd {
    font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    font-size: 26px;
    color: var(--text-0);
  }
</style>
</head>
<body>
  <div class="stage">
    <div class="grid"></div>
    <div class="content">
      <div class="mark">
        <div class="dot"></div>
        <div class="name">{{name}}</div>
      </div>
      <div class="tagline">{{tagline}}</div>
      <div class="chip">
        <span class="prompt">$</span><span class="cmd">{{install}}</span>
      </div>
    </div>
  </div>
</body>
</html>
